# main 에 머지될 때마다 macOS(Apple Silicon) 용 GUI dmg 와 TUI/MCP tar.gz 를 빌드해서 GitHub Release 로 올린다.
# 버전: 마지막 태그(vX.Y.Z)의 patch +1. 소스(Cargo.toml) 버전이 그보다 높으면(PR 에서 minor/major 를 올린 경우) 그 버전.
# 버전은 빌드할 때만 매니페스트에 넣고 main 에 커밋하지 않는다 (main 은 PR 로만 바뀐다). 기준은 태그.
# 공급망: 액션은 커밋 SHA 로 고정 (태그는 옮겨질 수 있다), Cargo.lock 그대로(--locked), SHA256SUMS 와 빌드 출처 증명(attestation) 을 함께 올린다.
# qurry-tui --update 는 SHA256SUMS 로 받은 파일을 검증한다.
# GUI 앱 안 업데이트(Tauri updater): Qurry_<v>_aarch64.app.tar.gz 와 서명, latest.json 을 함께 올린다.
# 이름 변경(dbtool → Qurry) 이전 설치도 업데이트되게: CLI 묶음을 dbtool-cli_… 이름으로도 올리고, 묶음 안에 dbtool-tui / dbtool-mcp 도 넣는다
#   (0.1.x 의 dbtool-tui --update 는 dbtool-cli_ 묶음에서 dbtool-tui · dbtool-mcp 를 찾는다).
#   서명 키는 레포 Secrets(TAURI_SIGNING_PRIVATE_KEY / _PASSWORD), 공개키는 src-tauri/tauri.conf.json.
#   키는 Sign 단계에만 넘긴다: 빌드(빌드 스크립트·플러그인이 모두 도는 단계)에는 넘기지 않는다.
#   SHA256SUMS 도 같은 키로 서명한다 (SHA256SUMS.sig — qurry-tui --update 가 확인).
# main 에서만 돈다 (다른 브랜치에서 수동 실행해 latest 로 내보내지 못하게).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# 머지가 연달아 와도 한 번에 하나씩 (같은 버전 태그를 두 번 만들지 않게)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: ver
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          latest=${latest#v}
          [ -z "$latest" ] && latest=0.0.0
          src=$(grep -m1 '^version' crates/core/Cargo.toml | cut -d'"' -f2)
          if [ "$src" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$src" | sort -V | tail -1)" = "$src" ]; then
            v=$src
          else
            IFS=. read -r ma mi pa <<< "$latest"
            v="$ma.$mi.$((pa + 1))"
          fi
          echo "latest tag: $latest · source: $src → release: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set version in manifests
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          for f in crates/core/Cargo.toml crates/tui/Cargo.toml crates/mcp/Cargo.toml src-tauri/Cargo.toml; do
            perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' "$f"
          done
          for f in package.json src-tauri/tauri.conf.json; do
            perl -0pi -e 's/"version": "[^"]*"/"version": "$ENV{V}"/' "$f"
          done
          # Cargo.lock 의 워크스페이스 버전만 맞춘다 (외부 의존성은 lock 그대로 → 아래 --locked 빌드)
          cargo update --workspace
          git diff --stat

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GUI (dmg + app, unsigned)
        # 업데이트 묶음은 아래에서 직접 만들고 Sign 단계에서 서명한다 (여기엔 서명 키가 없다)
        run: pnpm tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      - name: Build TUI and MCP
        run: cargo build --release --locked -p qurry-tui -p qurry-mcp

      - name: Package
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir dist-release
          cp "target/release/bundle/dmg/Qurry_${V}_aarch64.dmg" dist-release/
          # CLI: qurry-tui · qurry-mcp + 예전 이름 dbtool-tui · dbtool-mcp (같은 바이너리)
          mkdir cli
          cp target/release/qurry-tui target/release/qurry-mcp cli/
          cp cli/qurry-tui cli/dbtool-tui
          cp cli/qurry-mcp cli/dbtool-mcp
          tar -czf "dist-release/qurry-cli_${V}_aarch64-apple-darwin.tar.gz" -C cli qurry-tui qurry-mcp dbtool-tui dbtool-mcp
          cp "dist-release/qurry-cli_${V}_aarch64-apple-darwin.tar.gz" "dist-release/dbtool-cli_${V}_aarch64-apple-darwin.tar.gz"
          # 앱 안 업데이트 묶음 (Tauri 와 같은 형식: 맨 위가 Qurry.app/). 서명은 다음 단계에서
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "dist-release/Qurry_${V}_aarch64.app.tar.gz" -C target/release/bundle/macos Qurry.app
          sed "s/{{VERSION}}/${V}/g" .github/release-notes.md > release-notes.md

      - name: Sign (updater bundle, SHA256SUMS)
        # 서명 키는 이 단계에만. 실행하는 것은 tauri signer 뿐이다
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          app="Qurry_${V}_aarch64.app.tar.gz"
          pnpm tauri signer sign "dist-release/$app" > /dev/null
          mv "dist-release/$app.sig" app.sig
          # latest.json: 앱은 releases/latest/download/latest.json 을 본다
          jq -n --arg v "$V" --arg sig "$(cat app.sig)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/$app" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' > dist-release/latest.json
          cat dist-release/latest.json
          # 체크섬 + 그 서명 (qurry-tui --update 가 둘 다 확인한다)
          (cd dist-release && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS)
          pnpm tauri signer sign dist-release/SHA256SUMS > /dev/null
          ls -la dist-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist-release/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${V}" dist-release/* \
            --target "$GITHUB_SHA" \
            --title "Qurry ${V}" \
            --notes-file release-notes.md \
            --generate-notes
